# FinTrace-CN Agent Ablation CI
#
# Runs the offline agent ablation benchmark on every push and pull request
# to the main branch.  All tests are fully offline — no API keys, no LLM
# calls, no network — so any contributor can reproduce the results with
# ``git clone && pip install && pytest``.
#
# Usage
# -----
#   pytest -q -m "not integration"     # all offline tests (including ablation)
#   python scripts/run_agent_ablation.py --dry-run   # full ablation report

name: Agent Ablation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ablation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run offline regression suite
        run: python -m pytest -q -m "not integration" -p no:cacheprovider

      - name: List fixture cases
        run: python scripts/run_agent_ablation.py --list

      - name: Run offline ablation tests
        run: python -m pytest tests/test_cn_agent_ablation.py -v -p no:cacheprovider

      - name: Run full dry-run ablation (all 4 variants × 7 cases)
        run: python scripts/run_agent_ablation.py --dry-run --output output/ci_ablation

      - name: Enforce deterministic ablation regression gate
        run: python scripts/check_ablation_thresholds.py output/ci_ablation/ablation_results.json

      - name: Upload ablation report
        uses: actions/upload-artifact@v4
        with:
          name: ablation-report
          path: output/ci_ablation/
          retention-days: 30
