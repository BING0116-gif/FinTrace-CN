[pytest]
# Default `pytest -q` runs ONLY offline/mocked tests — no real API calls, no cost.
# Real DeepSeek integration tests are marked `integration` and are skipped
# automatically when DEEPSEEK_API_KEY is not set. Run them explicitly:
#   pytest -m integration -v          (requires DEEPSEEK_API_KEY)
# To guarantee zero cost even when a key is present:
#   pytest -q -m "not integration"
markers =
    integration: marks tests that call the real DeepSeek API (run with -m integration; skipped without DEEPSEEK_API_KEY)

asyncio_mode = strict
